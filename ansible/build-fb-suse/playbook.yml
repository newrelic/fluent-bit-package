- name: Provision SUSE instances and compile Fluent Bit
  # Target only hosts with 'fluentbit-builder' in their hostname
  hosts: "*fluentbit-builder*" 
  # The any_errors_fatal field doesn't work with free strategy.
  # If there are spurious failures in the PLAY, it is good to run
  # the playbook again by removing free strategy.
  any_errors_fatal: true
  strategy: free
  vars:
    ansible_aws_ssm_timeout: 900
    ansible_aws_ssm_retries: 10
    home_path: /home/ssm-user
    bison_version: 3.7
    bison_path: "{{ home_path }}/bison-{{ bison_version }}"
    # We need cmake 3.23.0 at least, as the one present in SLES 12.X is too old for Fluent Bit
    cmake_version: 3.23.0
    # "arch" below comes from the gathered inventory variables (defined further down in this
    # same vars block) -- Ansible resolves vars lazily against the full merged namespace, not
    # top-to-bottom, so this forward reference is fine.
    cmake_path: "{{ home_path }}/cmake-{{ cmake_version }}-linux-{{ arch }}"
    fluent_bit_path: "{{ home_path }}/fluent-bit"
    # The following information is populated using the gathered inventory variables
    fluent_bit_version: "{{ tags.fb_version }}"
    os_distro: "{{ tags.os_distro }}"
    os_version: "{{ tags.os_version }}"
    arch: "{{ tags.arch }}"
    fluent_bit_package_name: "fluent-bit-{{ fluent_bit_version }}-1.{{ os_distro }}{{ os_version }}.{{ arch }}.rpm"
  tasks:
    - name: Wait for connection to be available
      block:
        - name: Initial connection attempt
          wait_for_connection:
            delay: 5
            timeout: 600
            connect_timeout: 120
      rescue:
        - name: Reset connection on failure
          meta: reset_connection
        - name: Retry connection with extended timeout
          wait_for_connection:
            delay: 10
            timeout: 900
            connect_timeout: 180
        - name: Verify recovered connection
          ansible.builtin.ping:

    - name: Install dependencies
      community.general.zypper:
        # SLES 16 ships a new enough system bison (3.8.2) for Fluent Bit, so it's installed
        # here instead of building bison from source below (which fails on SLES 16 -- its
        # gnulib snapshot doesn't compile under GCC 15/16, see the Bison tasks' "when").
        name: >-
          {{
            ['git', 'flex', 'wget', 'libyaml-devel', 'libopenssl-devel',
             'systemd-devel', 'gcc', 'gcc-c++', 'rpm-build', cpp_with_version]
            + (['bison'] if 'suse_16' in group_names else [])
          }}
        state: present
        oldpackage: true
        force_resolution: true
      become: true
      register: install_status
      until: install_status is success
      # Retry up to 5 minutes, because at startup the zypper command might temporarily hold a lock that prevents installing packages
      delay: 15
      retries: 20

    # Bison {{ bison_version }}'s bundled gnulib snapshot doesn't compile under SLES 16's
    # GCC 15/16 (nodiscard-attribute parse failure in gl_list.h, cascading into
    # implicit-function-declaration errors GCC treats as hard errors by default). SLES 16's
    # system bison (3.8.2, installed above) is new enough for Fluent Bit, so skip building
    # from source there.
    - name: Download and extract Bison {{ bison_version }}
      unarchive:
        src: http://ftp.gnu.org/gnu/bison/bison-{{ bison_version }}.tar.gz
        dest: "{{ home_path }}"
        remote_src: yes
        creates: "{{ bison_path }}"
      when: "'suse_16' not in group_names"

    - name: Configure Bison {{ bison_version }}
      command:
        cmd: ./configure
        chdir: "{{ bison_path }}"
      when: "'suse_16' not in group_names"

    - name: Build Bison {{ bison_version }}
      community.general.make:
        chdir: "{{ bison_path }}"
      when: "'suse_16' not in group_names"

    - name: Install Bison {{ bison_version }}
      community.general.make:
        chdir: "{{ bison_path }}"
        target: install
      become: true
      when: "'suse_16' not in group_names"

    - name: Create symbolic link for Bison {{ bison_version }} in /usr/bin
      file:
        src: /usr/local/bin/bison
        dest: /usr/bin/bison
        state: link
      become: true
      when: "'suse_16' not in group_names"

    - name: Download and extract Cmake {{ cmake_version }}
      unarchive:
        src: "https://github.com/Kitware/CMake/releases/download/v{{ cmake_version }}/cmake-{{ cmake_version }}-linux-{{ arch }}.tar.gz"
        dest: "{{ home_path }}"
        remote_src: yes
        creates: "{{ cmake_path }}"

    - name: Checkout Fluent Bit {{ fluent_bit_version }}
      git:
        repo: 'https://github.com/fluent/fluent-bit.git'
        dest: "{{ fluent_bit_path }}"
        version: "v{{ fluent_bit_version }}"

    - name: Configure Fluent Bit {{ fluent_bit_version }}
      command:
        cmd: "{{ cmake_path }}/bin/cmake -DCMAKE_INSTALL_PREFIX=/opt/fluent-bit/ -DCMAKE_INSTALL_SYSCONFDIR=/etc/ .."
        chdir: "{{ fluent_bit_path }}/build"

    - name: Build Fluent Bit {{ fluent_bit_version }}
      community.general.make:
        chdir: "{{ fluent_bit_path }}/build"
      async: 1800 # timeout 30m
      poll: 30 # poll every 30s

    - name: Create SUSE RPM package for Fluent Bit {{ fluent_bit_version }}
      command:
        cmd: "{{ cmake_path }}/bin/cpack -G RPM"
        chdir: "{{ fluent_bit_path }}/build"
        # cpack names the RPM after the actual build arch (e.g. "aarch64" on ARM, not "x86_64") --
        # hardcoding this guard to x86_64 meant it could never match on an ARM host.
        creates: "{{ fluent_bit_path }}/build/fluent-bit-{{ fluent_bit_version }}-1.{{ arch }}.rpm"
      async: 420 # timeout 7m
      poll: 30 # poll every 30s

    - name: Rename binary for the specific OS type, version and arch
      # Not actually renaming but copying, so that the previous step nor this one won't be re-executed thanks to "creates"
      command:
        cmd: "cp fluent-bit-{{ fluent_bit_version }}-1.{{ arch }}.rpm {{ fluent_bit_package_name }}"
        chdir: "{{ fluent_bit_path }}/build"
        creates: "{{ fluent_bit_path }}/build/{{ fluent_bit_package_name }}"

    - name: Download generated Fluent Bit RPM package
      fetch:
        src: "{{ fluent_bit_path }}/build/{{ fluent_bit_package_name }}"
        dest: "/tmp/fluent-bit-suse-packages/"
        flat: true
      register: fetch_result
      until: fetch_result is succeeded
      retries: 5
      delay: 15