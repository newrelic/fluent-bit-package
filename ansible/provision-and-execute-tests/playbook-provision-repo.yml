- name: (linux) (production/staging) Install CrowdStrike Falcon and NRIA
  hosts: linux
  # Using free strategy for parallel execution across hosts
  # Note: any_errors_fatal is incompatible with free strategy
  strategy: free
  vars:
    # Increased timeouts to handle long-running agent installation (3-5 minutes)
    # AWS SSM already sends protocol-level keepalives, so explicit keepalive not needed
    ansible_aws_ssm_timeout: 900   # 15 minutes (reasonable for 3-5 min operation with buffer)
    ansible_aws_ssm_retries: 15    # Increased from 10
    # NRIA_REPO_ENDPOINT is the bucket root (v1) or the bucket root + repository folder (v2: .../infrastructure_agent_v2/)
    nria_repo_endpoint: "{{ lookup('ansible.builtin.env', 'NRIA_REPO_ENDPOINT') }}"
    nria_repo_root: "{{ (nria_repo_endpoint | regex_search('^https?://[^/]+') | default('', true)) ~ '/' }}"
    fb_version: "{{ tags.fb_version }}"
    nria_repo_path: "{{ (nria_repo_endpoint | regex_replace('^https?://[^/]+/?', '') | trim('/')) | default('infrastructure_agent', true) }}"
  become: true
  gather_facts: no
  tasks:
    # Same sudo-rs use_pty fix as the prerelease playbook: write the !use_pty
    # drop-in via a raw `become` before the first sudo task. Resolute only; safe to re-run.
    - name: "PRE | non-become connectivity"
      become: false
      when: tags.os_distro == 'ubuntu' and tags.os_version == 'resolute'
      ansible.builtin.wait_for_connection:
        delay: 5
        timeout: 180

    - name: "PRE | bootstrap disable sudo use_pty (raw become, idempotent)"
      become: true
      when: tags.os_distro == 'ubuntu' and tags.os_version == 'resolute'
      timeout: 90
      changed_when: false
      failed_when: false
      ignore_unreachable: true
      ansible.builtin.raw: |
        test -f /etc/sudoers.d/99-disable-use-pty || { echo 'Defaults !use_pty' > /etc/sudoers.d/99-disable-use-pty && chmod 440 /etc/sudoers.d/99-disable-use-pty; }

    - name: Establish initial connection to host
      block:
        - name: Wait for connection to be available
          wait_for_connection:
            delay: 10
            timeout: 300
            connect_timeout: 60
          register: initial_connection

        - name: Verify connection with ping
          ansible.builtin.ping:
      rescue:
        - name: Reset connection on initial failure
          ansible.builtin.meta: reset_connection

        - name: Retry connection with extended timeout
          wait_for_connection:
            delay: 20
            timeout: 600
            connect_timeout: 120
          retries: 5
          delay: 60
          register: retry_connection
          until: retry_connection is succeeded

    - name: Gather facts for first time
      ansible.builtin.setup:
    
    - name: Ensure 'which' command is installed
      ansible.builtin.package:
        name: which
        state: present
      when: ansible_distribution == 'Rocky'

#    - name: Install crowdstrike falcon
#      ansible.builtin.include_role:
#        name: caos.ansible_roles.install_crowdstrike_falcon
#      vars:
#        falcon_client_id: "{{ lookup('env', 'CROWDSTRIKE_CLIENT_ID') }}"
#        falcon_client_secret: "{{ lookup('env', 'CROWDSTRIKE_CLIENT_SECRET') }}"
#        falcon_customer_id: "{{ lookup('env', 'CROWDSTRIKE_CUSTOMER_ID') }}"
#        api_base_url: "https://api.laggar.gcw.crowdstrike.com"

    - name: Install newrelic-infra agent with retry logic
      block:
        - name: Install newrelic-infra agent
          ansible.builtin.include_role:
            name: caos.ansible_roles.newrelic_cli
          vars:
            repo_endpoint: "{{ nria_repo_root }}"
            recipe: "newrelic-infra"
            repo_folder: "{{ nria_repo_path }}" # needs a newrelic-infra recipe/role that supports it, ignored otherwise
            region: "{{ lookup('ansible.builtin.env', 'NEW_RELIC_REGION') }}" # US | EU | STAGING
            nr_api_key: "{{ lookup('ansible.builtin.env', 'NEW_RELIC_API_KEY') }}"
            nr_account_id: "{{ lookup('ansible.builtin.env', 'NEW_RELIC_ACCOUNT_ID') }}"
          # Note: async/poll not supported on include_role. Relies on command_timeout = 300s in ansible.cfg
      rescue:
        - name: Log connection failure for observability
          ansible.builtin.debug:
            msg: "WARNING: SSM connection lost during agent install on {{ inventory_hostname }}. Attempting recovery..."

        - name: Connection lost during agent install - reset connection
          ansible.builtin.meta: reset_connection

        - name: Wait for connection to recover after reset
          wait_for_connection:
            delay: 10
            timeout: 300
            connect_timeout: 60
          retries: 3
          delay: 30
          register: recovery_connection
          until: recovery_connection is succeeded

        - name: Verify connection is working
          ansible.builtin.ping:
          retries: 3
          delay: 10

        - name: Retry agent installation after connection recovery
          ansible.builtin.include_role:
            name: caos.ansible_roles.newrelic_cli
          vars:
            repo_endpoint: "{{ nria_repo_root }}"
            recipe: "newrelic-infra"
            repo_folder: "{{ nria_repo_path }}" # needs a newrelic-infra recipe/role that supports it, ignored otherwise
            region: "{{ lookup('ansible.builtin.env', 'NEW_RELIC_REGION') }}" # US | EU | STAGING
            nr_api_key: "{{ lookup('ansible.builtin.env', 'NEW_RELIC_API_KEY') }}"
            nr_account_id: "{{ lookup('ansible.builtin.env', 'NEW_RELIC_ACCOUNT_ID') }}"
          register: retry_result

        - name: Log successful recovery
          ansible.builtin.debug:
            msg: "SUCCESS: Agent installation completed after connection recovery on {{ inventory_hostname }}"
          when: retry_result is succeeded
    # For any repository folder other than infrastructure_agent (v2: infrastructure_agent_v2), newrelic-infra should
    # already have been installed from it by the recipe (repo_folder above). Recipes that do not support that yet
    # install from infrastructure_agent (v1): then the repository definition written by the recipe is pointed at the
    # folder under test and newrelic-infra is force-reinstalled. fluent-bit is installed (pinned to the version under
    # test) from the folder under test either way. playbook-run-tests.yml then asserts the installed fluent-bit
    # version and that both packages came from that folder.
    - name: Install newrelic-infra and fluent-bit from the {{ nria_repo_path }} repository
      when: nria_repo_path != 'infrastructure_agent'
      vars:
        nria_repo_file: "{{ {'Debian': '/etc/apt/sources.list.d/newrelic-infra.list', 'RedHat': '/etc/yum.repos.d/newrelic-infra.repo', 'Suse': '/etc/zypp/repos.d/newrelic-infra.repo'}[ansible_os_family] }}"
        nria_v2_url: "{{ nria_repo_root }}{{ nria_repo_path }}/linux"
      block:
        - name: Read the repo definition written by the newrelic-cli recipe
          ansible.builtin.slurp:
            src: "{{ nria_repo_file }}"
          register: nria_repo_from_recipe

        - name: Check whether the recipe installed newrelic-infra directly from {{ nria_repo_path }}
          ansible.builtin.set_fact:
            nria_installed_from_v2: "{{ nria_v2_url in (nria_repo_from_recipe.content | b64decode) }}"

        - name: Report where the recipe installed newrelic-infra from
          ansible.builtin.debug:
            msg: >-
              {{ ('newrelic-infra was installed directly from ' ~ nria_v2_url) if (nria_installed_from_v2 | bool)
                 else 'WARNING: the newrelic-cli recipe installed newrelic-infra from infrastructure_agent (v1), it does not support NEW_RELIC_INFRA_REPO_FOLDER yet. Falling back to rewriting the repo definition and reinstalling.' }}

        - name: Point the repo definition at {{ nria_repo_path }}
          ansible.builtin.replace:
            path: "{{ nria_repo_file }}"
            regexp: 'https?://[^/\s]+/infrastructure_agent/linux'
            replace: "{{ nria_v2_url }}"

        # ansible.builtin.replace reports ok when the regexp matches nothing, which would silently keep installing from v1
        - name: Read the repo definition
          ansible.builtin.slurp:
            src: "{{ nria_repo_file }}"
          register: nria_repo_definition

        - name: Assert the repo definition points at {{ nria_repo_path }} only
          ansible.builtin.assert:
            that:
              - nria_v2_url in (nria_repo_definition.content | b64decode)
              - (nria_repo_definition.content | b64decode) is not search('/infrastructure_agent/linux')
            fail_msg: >-
              {{ inventory_hostname }}: {{ nria_repo_file }} was not rewritten to {{ nria_v2_url }}. The newrelic-cli
              recipe probably changed the repository URL it writes, so the regexp
              'https?://[^/\s]+/infrastructure_agent/linux' no longer matches. Current content:
              {{ nria_repo_definition.content | b64decode }}

        - name: Refresh apt metadata
          when: ansible_os_family == 'Debian'
          ansible.builtin.apt:
            update_cache: true

        - name: Refresh yum/dnf metadata
          when: ansible_os_family == 'RedHat'
          ansible.builtin.shell: "command -v dnf >/dev/null && dnf clean expire-cache || yum clean expire-cache"
          changed_when: false

        - name: Refresh zypper metadata (import the new repository key)
          when: ansible_os_family == 'Suse'
          ansible.builtin.command: zypper --non-interactive --gpg-auto-import-keys refresh
          changed_when: false

        # Only needed when the recipe installed from v1: newrelic-infra is already installed at the same version, so a
        # plain install would be a no-op. Force a reinstall, which can only fetch it from the repository rewritten above.
        - name: Reinstall newrelic-infra from {{ nria_repo_path }}
          when: not (nria_installed_from_v2 | bool)
          ansible.builtin.command: >-
            {{ {'Debian': 'apt-get install -y --reinstall -o Dpkg::Options::=--force-confold newrelic-infra',
                'RedHat': ansible_pkg_mgr ~ ' -y reinstall newrelic-infra',
                'Suse': 'zypper --non-interactive install --force newrelic-infra'}[ansible_os_family] }}
          environment:
            DEBIAN_FRONTEND: noninteractive
          register: nria_reinstall
          until: nria_reinstall is succeeded
          retries: 5          # Retry to handle package manager lock contention
          delay: 10

        # Same as roles/install_fluent_bit_from_gh_prerelease: we want our package to overwrite the one that comes with
        # the Infra Agent, even if it implies downgrading it.
        - name: Install fluent-bit {{ fb_version }} from {{ nria_repo_path }} (apt)
          when: ansible_pkg_mgr == 'apt'
          ansible.builtin.apt:
            name: "fluent-bit={{ fb_version }}"
            allow_downgrade: true
            state: present
          register: fb_install
          until: fb_install is succeeded
          retries: 5
          delay: 10

        - name: Install fluent-bit {{ fb_version }} from {{ nria_repo_path }} (dnf)
          when: ansible_pkg_mgr == 'dnf'
          ansible.builtin.dnf:
            name: "fluent-bit-{{ fb_version }}"
            allow_downgrade: true
            state: present
          register: fb_install
          until: fb_install is succeeded
          retries: 5
          delay: 10

        - name: Install fluent-bit {{ fb_version }} from {{ nria_repo_path }} (yum)
          when: ansible_pkg_mgr == 'yum'
          ansible.builtin.yum:
            name: "fluent-bit-{{ fb_version }}"
            allow_downgrade: true
            state: present
          register: fb_install
          until: fb_install is succeeded
          retries: 5
          delay: 10

        - name: Install fluent-bit {{ fb_version }} from {{ nria_repo_path }} (zypper)
          when: ansible_pkg_mgr == 'zypper'
          community.general.zypper:
            name: "fluent-bit={{ fb_version }}"
            oldpackage: true
            state: present
          register: fb_install
          until: fb_install is succeeded
          retries: 5
          delay: 10
